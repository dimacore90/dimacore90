services:
  - type: web
    name: wedding-seating-app
    runtime: python
    rootDir: wedding-seating-app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SHEETS_CSV_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        sync: false
      - key: LAYOUT_FILE
        value: data/layout.json
      - key: FALLBACK_GUESTS_FILE
        value: data/guests.json
      - key: GUESTS_CACHE_FILE
        value: data/guests_cache.json
