{% extends "base.html" %}

{% block title %}Поиск гостя{% endblock %}

{% block content %}
<section class="guest-hero compact">
  <div class="hero-divider">
    <span></span>
    <strong>♥</strong>
    <span></span>
  </div>
  <h1 class="search-title">Введите имя и фамилию</h1>

  <form class="search-form wedding-search-form" action="/result" method="post">
    <label>
      <span>Имя</span>
      <input type="text" name="first_name" autocomplete="given-name" required placeholder="Анна">
    </label>
    <label>
      <span>Фамилия</span>
      <input type="text" name="last_name" autocomplete="family-name" required placeholder="Иванова">
    </label>
    <button type="submit">Показать мой стол</button>
  </form>
</section>
{% endblock %}
