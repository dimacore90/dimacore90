{% extends "base.html" %}

{% block title %}Свадебная рассадка{% endblock %}
{% block body_class %}home-page{% endblock %}

{% block content %}
<section class="guest-hero">
  <div class="hero-divider">
    <span></span>
    <strong>♥</strong>
    <span></span>
  </div>
  <p class="eyebrow wedding-eyebrow">Добро пожаловать на свадьбу</p>
  <p class="lead wedding-lead">Посмотрите общий план зала и нажмите кнопку, чтобы узнать номер своего стола.</p>
  <a class="button-link primary" href="/search">Найти свое место</a>
</section>

<section class="section">
  <div class="hall-map image-map" style="--hall-width: {{ layout.hall.width }}; --hall-height: {{ layout.hall.height }};">
    <img src="{{ url_for('static', path='/images/seating-plan.png') }}" alt="План рассадки гостей по столам">
  </div>
</section>
{% endblock %}
