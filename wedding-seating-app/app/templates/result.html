{% extends "base.html" %}

{% block title %}Ваш стол{% endblock %}

{% block content %}
<section class="result-header">
  <p class="eyebrow">Ваше место найдено</p>
  <h1>{{ guest.first_name }} {{ guest.last_name }}</h1>
  <div class="result-summary">
    <span>{{ table_name }}</span>
  </div>
</section>

<section class="section">
  <h2>План зала</h2>
  <div class="hall-map image-map" style="--hall-width: {{ layout.hall.width }}; --hall-height: {{ layout.hall.height }};">
    <img src="{{ url_for('static', path='/images/seating-plan.png') }}" alt="План рассадки гостей по столам">
    {% for item in layout.tables %}
      <div
        class="map-table marker {{ item.shape }} {% if table and item.id == table.id %}active{% endif %}"
        style="left: {{ (item.x / layout.hall.width * 100)|round(2) }}%; top: {{ (item.y / layout.hall.height * 100)|round(2) }}%;"
      >
        <span>{{ item.name }}</span>
      </div>
    {% endfor %}
  </div>
</section>

<div class="center-actions">
  <a class="button-link secondary" href="/search">Новый поиск</a>
  <a class="button-link secondary" href="/">На главную</a>
</div>
{% endblock %}
